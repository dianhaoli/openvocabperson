# OpenVocab Vision: PostgreSQL (pgvector) + one backend container serving the API and the UI.
#
#   cp .env.example .env            # add OPENAI_API_KEY (or another provider) – optional
#   docker compose up -d --build    # → http://localhost:8000
#
# NVIDIA GPU:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# nginx UI:     docker compose --profile nginx up -d   (UI on :3000 proxied to the backend)
#
# Values below are read from your shell or from .env (compose interpolation); everything in
# .env is also passed into the backend container.

name: openvocab

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ovp
    volumes:
      - pgdata:/var/lib/postgresql/data
    # not published by default; uncomment to reach the database from the host
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ovp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        REQUIREMENTS: ${REQUIREMENTS:-requirements.txt}
    image: openvocab-vision:${OVP_IMAGE_TAG:-latest}
    ports:
      - "${OVP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ovp
      # container paths (fixed: they must match the volumes below, whatever .env says)
      OVP_STORAGE_DIR: /data/storage
      OVP_WEIGHTS_DIR: /data/weights
      OVP_FRONTEND_DIST: /app/frontend/dist
      # model specs ("auto" picks the best available; see README → Models)
      OVP_DEVICE: ${OVP_DEVICE:-auto}
      OVP_DETECTOR: ${OVP_DETECTOR:-auto}
      OVP_SEGMENTER: ${OVP_SEGMENTER:-auto}
      OVP_VLM: ${OVP_VLM:-auto}
      OVP_LLM: ${OVP_LLM:-auto}
      OVP_EMBEDDER: ${OVP_EMBEDDER:-auto}
      OVP_TEXT_EMBEDDER: ${OVP_TEXT_EMBEDDER:-auto}
      OVP_REID: ${OVP_REID:-auto}
      # provider credentials / endpoints (empty = provider disabled)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Ollama on the host machine
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OVP_COMPAT_BASE_URL: ${OVP_COMPAT_BASE_URL:-}
      OVP_COMPAT_API_KEY: ${OVP_COMPAT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/data/storage   # originals, thumbnails, crops
      - weights:/data/weights   # detector / segmenter weights (auto-downloaded on first use)
      - model-cache:/data/cache # Hugging Face, torch hub (OSNet), CLIP caches
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: serve the UI from nginx on :3000 (the backend already serves it on :8000).
  frontend:
    profiles: ["nginx"]
    build:
      context: ./frontend
    ports:
      - "${OVP_UI_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  weights:
  model-cache:
